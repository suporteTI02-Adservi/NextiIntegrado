name: Release Automated Build

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore build environment
        shell: pwsh
        env:
          BUILD_ENV: ${{ secrets.ENV }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_ENV)) {
            throw 'O repository secret ENV está vazio ou indisponível.'
          }

          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE '.env'),
            $env:BUILD_ENV,
            [System.Text.UTF8Encoding]::new($false)
          )

          $requiredVariables = @(
            'SENIOR_USER',
            'SENIOR_PASS',
            'CLIENT_ID',
            'CLIENT_SECRET',
            'AUTH_TOKEN',
            'VITE_CF_CLIENT_ID',
            'VITE_CF_CLIENT_SECRET'
          )
          $definedVariables = Get-Content '.env' | ForEach-Object {
            if ($_ -match '^\s*([^#][^=]*)=(.*)$' -and -not [string]::IsNullOrWhiteSpace($Matches[2])) {
              $Matches[1].Trim()
            }
          }
          $missingVariables = $requiredVariables | Where-Object { $_ -notin $definedVariables }
          if ($missingVariables) {
            throw "O secret ENV não possui valores para: $($missingVariables -join ', ')."
          }

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "A tag '$env:GITHUB_REF_NAME' não corresponde à versão '$version' do tauri.conf.json. Use '$expectedTag'."
          }

      - name: Validate updater signing credentials
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'O secret TAURI_SIGNING_PRIVATE_KEY está vazio ou indisponível.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'O secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD está vazio ou indisponível.'
          }
          $probe = Join-Path $env:RUNNER_TEMP 'updater-signing-probe.txt'
          [System.IO.File]::WriteAllText($probe, 'Nexti Integrado updater signing probe')
          & '.\node_modules\.bin\tauri.cmd' signer sign $probe
          if ($LASTEXITCODE -ne 0) {
            throw 'A chave privada e a senha do updater não formam um par válido.'
          }

      - name: Build Tauri Application and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Nexti Integrado v__VERSION__
          releaseBody: Nova versão lançada automaticamente pelo GitHub Actions.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # Compatibilidade com a versão 3.0.0, que consulta updater.json.
      - name: Publish legacy updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (
            Get-Content 'src-tauri/tauri.conf.json' -Raw |
            ConvertFrom-Json
          ).version

          $tag = "v$version"
          $compatDirectory = Join-Path $env:RUNNER_TEMP 'updater-compat'

          New-Item `
            -ItemType Directory `
            -Path $compatDirectory `
            -Force |
            Out-Null

          gh release download `
            $tag `
            --pattern 'latest.json' `
            --dir $compatDirectory

          Copy-Item `
            (Join-Path $compatDirectory 'latest.json') `
            (Join-Path $compatDirectory 'updater.json')

          gh release upload `
            $tag `
            (Join-Path $compatDirectory 'updater.json') `
            --clobber
